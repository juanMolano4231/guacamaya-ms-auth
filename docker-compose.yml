services:
  app:
    image: guacamaya-auth
    build: .
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/guacamaya_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ikEvs1crXV2ewH4SD0v0
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: guacamaya_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ikEvs1crXV2ewH4SD0v0
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: